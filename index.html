<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criador de Sobreviventes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6; --panel:#fffdf8; --ink:#1f1b16; --muted:#6b6257; --line:#d9d0c1;
  --accent:#9b1c1c; --accent-ink:#fff; --soft:#f6e7e2; --ok:#2f6b3a; --warn:#a35b00;
  --die:#24201b; --die-ink:#f3efe6; --stress:#e2b007; --stress-ink:#2a2200;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141210; --panel:#1d1a17; --ink:#ece6dc; --muted:#a39888; --line:#37312a;
    --accent:#d64545; --accent-ink:#fff; --soft:#2b1d1b; --ok:#6fbf7d; --warn:#e0a24a;
    --die:#ece6dc; --die-ink:#141210; --stress:#e2b007; --stress-ink:#2a2200;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#141210; --panel:#1d1a17; --ink:#ece6dc; --muted:#a39888; --line:#37312a;
  --accent:#d64545; --accent-ink:#fff; --soft:#2b1d1b; --ok:#6fbf7d; --warn:#e0a24a;
  --die:#ece6dc; --die-ink:#141210; --stress:#e2b007; --stress-ink:#2a2200;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.typer{font-family:"Special Elite","Courier New",monospace;font-weight:400;letter-spacing:.02em}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.45rem;margin:0 0 .25rem}
h3{font-size:1.1rem;margin:1rem 0 .4rem}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.5rem .65rem;width:100%}
textarea{min-height:70px;resize:vertical}
label{font-weight:600;font-size:.9rem;display:block;margin:.6rem 0 .25rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.top .sub{color:var(--muted);font-size:.85rem}
.top .acts{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:.5rem .9rem;border-radius:8px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:.25rem .55rem;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;gap:20px;max-width:1400px;margin:0 auto;padding:20px}
nav.steps{position:sticky;top:78px;align-self:start}
nav.steps ol{list-style:none;margin:0;padding:0;counter-reset:s}
nav.steps li{counter-increment:s}
nav.steps button{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--muted);padding:.45rem .5rem;border-radius:8px}
nav.steps button::before{content:counter(s);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);font-size:.8rem;flex:none}
nav.steps button.on{color:var(--ink);background:var(--soft);font-weight:600}
nav.steps button.on::before{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.steps button.done::before{content:"✓";color:var(--ok);border-color:var(--ok)}
main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.help{background:var(--soft);border-left:4px solid var(--accent);border-radius:8px;padding:.75rem 1rem;margin:.75rem 0 1rem;font-size:.93rem}
.help b{color:var(--accent)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);text-align:left;color:var(--ink);width:100%}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.opt .t{font-family:"Special Elite",monospace;font-size:1.05rem}
.opt .m{color:var(--muted);font-size:.85rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.tag.k{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:.35rem .8rem;background:var(--panel);color:var(--ink)}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700}
.stepper .v{width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.attr{border:1px solid var(--line);border-radius:12px;padding:12px}
.attr.key{border-color:var(--accent)}
.pool{font-size:.8rem;color:var(--muted)}
.counter{font-weight:700;padding:.3rem .7rem;border-radius:99px;background:var(--soft)}
.counter.ok{color:var(--ok)} .counter.bad{color:var(--accent)}
.msg{font-size:.88rem;margin-top:.5rem}
.msg.bad{color:var(--accent)} .msg.ok{color:var(--ok)} .msg.warn{color:var(--warn)}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.skill{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;gap:8px}
.skill.key{border-color:var(--accent)}
.skill .n{font-weight:600}
.skill .d{font-size:.78rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.dice{display:flex;gap:6px;flex-wrap:wrap;margin:.4rem 0}
.die{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-weight:700;background:var(--die);color:var(--die-ink);font-variant-numeric:tabular-nums}
.die.roll{animation:spin .45s ease}
@keyframes spin{0%{transform:rotate(-30deg) scale(.6);opacity:.2}100%{transform:none;opacity:1}}
.eqlist{list-style:none;padding:0;margin:0}
.eqlist li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding:6px 0}
.eqlist .s{color:var(--muted);font-size:.8rem;white-space:nowrap}
aside.sheet{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.sheet h2{font-size:1.25rem}
.sheet .sec{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.sheet .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sheet .kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.88rem}
.sheet .kv span:nth-child(even){font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.track{display:flex;gap:4px}
.track i{width:16px;height:16px;border:1.5px solid var(--ink);border-radius:3px;display:inline-block}
.empty{color:var(--muted);font-style:italic}
.npc{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.88rem}
.npc .nm{font-weight:700}
.npc.anc{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.rel{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:end}
pre.json{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto;font-size:.78rem;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media (max-width:1100px){.wrap{grid-template-columns:1fr 320px}nav.steps{display:none}}
@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:16px}aside.sheet{position:static;max-height:none}.g2,.g3,.skills{grid-template-columns:1fr}.rel{grid-template-columns:1fr}.top{flex-wrap:wrap}}
@media print{
  .top,nav.steps,main{display:none!important}
  .wrap{display:block;padding:0}
  aside.sheet{position:static;max-height:none;overflow:visible;box-shadow:none;border:0}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Criador de Sobreviventes</h1>
    <div class="sub">RPG The Walking Dead Universe · passo a passo · exporta para o FoundryVTT</div>
  </div>
  <div class="acts">
    <button class="btn" id="bImportar" title="Carregar uma ficha .json salva">Abrir ficha</button>
    <button class="btn" id="bNovo">Nova ficha</button>
    <button class="btn" id="bTema" title="Alternar tema">◐</button>
    <input type="file" id="fArquivo" accept=".json,application/json" hidden>
  </div>
</header>

<div class="wrap">
  <nav class="steps"><ol id="nav"></ol></nav>
  <main><section class="card" id="passo"></section></main>
  <aside class="sheet card" id="ficha"></aside>
</div>
<div class="toast" id="toast"></div>

<script>
const D = {"ATRIBUTOS":{"vigor":{"nome":"Vigor","desc":"O quanto você é durão: aguentar e dar pancadas, seguir sem comida ou descanso, arrombar uma porta."},"agilidade":{"nome":"Agilidade","desc":"Coordenação e controle motor: esgueirar-se, equilibrar-se num telhado congelado, disparar uma arma."},"perspicacia":{"nome":"Perspicácia","desc":"Capacidade intelectual para resolver problemas, educação e prontidão."},"empatia":{"nome":"Empatia","desc":"Compreender outras pessoas para persuadir, cativar ou enganar."}},"PERICIAS":{"combateProximo":{"nome":"Combate Próximo","atributo":"vigor","desc":"Lutar desarmado ou com armas brancas. Sucessos extras aumentam o dano em +1 cada."},"forca":{"nome":"Força","atributo":"vigor","desc":"Erguer peso, arrombar portas, qualquer coisa que exija força bruta e determinação."},"tolerancia":{"nome":"Tolerância","atributo":"vigor","desc":"Suportar fome, frio, marchas longas, venenos e doenças. Às vezes pode passar sucessos extras a quem está na mesma situação."},"combateDistancia":{"nome":"Combate à Distância","atributo":"agilidade","desc":"Atacar com armas de disparo, arremesso ou explosivos. Sucessos extras aumentam o dano em +1 cada."},"mobilidade":{"nome":"Mobilidade","atributo":"agilidade","desc":"Correr, escalar, saltar para longe do perigo, dirigir em situação difícil, buscar cobertura e fugir. Pode passar sucessos extras para quem corre junto."},"furtividade":{"nome":"Furtividade","atributo":"agilidade","desc":"Esgueirar-se, esconder-se, abrir fechaduras, seguir alguém e prestidigitação. Pode passar sucessos extras para quem tenta o mesmo."},"reconhecimento":{"nome":"Reconhecimento","atributo":"perspicacia","desc":"Avaliar se um setor é seguro ao viajar e notar ameaças ou coisas escondidas. Sucessos extras podem dar +1 (máx. +3) a quem usar a informação."},"sobrevivencia":{"nome":"Sobrevivência","atributo":"perspicacia","desc":"Acampar, achar água, caçar, rastrear, vasculhar (cada sucesso extra = +1 ração) e palpitar onde encontrar um item."},"tecnologia":{"nome":"Tecnologia","atributo":"perspicacia","desc":"Consertar e construir equipamentos e armas; necessária para projetos no refúgio."},"lideranca":{"nome":"Liderança","atributo":"empatia","desc":"Mover uma multidão ou inspirar alguém (cada sucesso = +1 para o alvo num teste). Não pode ser ajudada. Falhar ao inspirar = 1 de estresse."},"manipulacao":{"nome":"Manipulação","atributo":"empatia","desc":"Fazer alguém pensar ou agir de certo modo com mentira, suborno, ameaça ou coação. Não é controle mental."},"medicina":{"nome":"Medicina","atributo":"empatia","desc":"Primeiros socorros, estabilizar lesões críticas, conhecimento de anatomia, doenças e tratamentos."}},"TALENTOS":{"habilidoso":{"nome":"Habilidoso","arquetipo":"cientista","pre":"Alguém lhe ensinou a consertar e construir coisas.","efeito":"Com tempo e ferramentas, conserta quase tudo, mesmo sem as peças certas. +2 em Tecnologia ao consertar coisas para um projeto.","bonus":[{"pericia":"tecnologia","valor":2,"condicao":"consertando para um projeto"}]},"intuicao":{"nome":"Intuição","arquetipo":"cientista","pre":"Você superou um Desafio impossível.","efeito":"Uma vez por sessão, pergunte ao mestre como as coisas funcionam/se relacionam para obter uma pista útil.","porSessao":true},"tecnoEnxerido":{"nome":"Tecno-enxerido","arquetipo":"cientista","pre":"Você usou ciência para conseguir o que queria.","efeito":"Ao discutir questões complexas, use Tecnologia no lugar de Manipulação.","substitui":[{"de":"manipulacao","por":"tecnologia","condicao":"discutindo questões complexas"}]},"criaDesteMundo":{"nome":"Cria deste Mundo","arquetipo":"crianca","pre":"Alguém que você amava foi mordido.","efeito":"Você não sofre estresse por ver alguém ser mordido."},"lutadorDeFaca":{"nome":"Lutador de Faca","arquetipo":"crianca","pre":"Você esfaqueou alguém.","efeito":"+1 de dano ao lutar com uma faca.","danoExtra":{"valor":1,"tipo":"faca","condicao":"lutando com faca"}},"teimoso":{"nome":"Teimoso","arquetipo":"crianca","pre":"Você não desistiu.","efeito":"Sua Motivação concede +3 em vez de +2.","teimoso":true},"facilitador":{"nome":"Facilitador","arquetipo":"criminoso","pre":"Você se deu muito bem numa negociação.","efeito":"+2 em Manipulação ao pechinchar um acordo.","bonus":[{"pericia":"manipulacao","valor":2,"condicao":"pechinchando um acordo"}]},"lutarSujo":{"nome":"Lutar Sujo","arquetipo":"criminoso","pre":"Você matou alguém com as mãos nuas.","efeito":"+1 de dano ao lutar desarmado.","danoExtra":{"valor":1,"tipo":"desarmado","condicao":"desarmado"}},"posturaAmeacadora":{"nome":"Postura Ameaçadora","arquetipo":"criminoso","pre":"Você arruinou a vida de alguém.","efeito":"Use Força no lugar de Manipulação ao ameaçar alguém.","substitui":[{"de":"manipulacao","por":"forca","condicao":"ameaçando alguém"}]},"costasNaParede":{"nome":"Costas na Parede","arquetipo":"donoDeCasa","pre":"Você revidou.","efeito":"Lutando em grande desvantagem, com os inimigos parecendo vencer, +1 de dano em todos os ataques.","danoExtra":{"valor":1,"tipo":"todos","condicao":"em grande desvantagem"}},"melhorMorto":{"nome":"Melhor Morto que Quebrado","arquetipo":"donoDeCasa","pre":"Você se sacrificou por um propósito maior.","efeito":"Uma vez por sessão, após um teste, perca 1 de Vida para ganhar 1 sucesso (extra). Explique como se feriu.","porSessao":true,"melhorMorto":true},"rostoInocente":{"nome":"Rosto Inocente","arquetipo":"donoDeCasa","pre":"Você fez alguém acreditar que era fraco.","efeito":"+2 em Manipulação ao fingir inocência diante de um estranho.","bonus":[{"pericia":"manipulacao","valor":2,"condicao":"fingindo inocência para um estranho"}]},"loboSolitario":{"nome":"Lobo Solitário","arquetipo":"exilado","pre":"Você foi traído por alguém em quem confiava.","efeito":"Você pode ser uma das suas próprias Âncoras.","loboSolitario":true},"sabeTodosOsTruques":{"nome":"Sabe Todos os Truques","arquetipo":"exilado","pre":"Você enganou alguém que tentou dominá-lo.","efeito":"Ao mentir, us const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d6 = () => 1+Math.floor(Math.random()*6);
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),1800); }
const arq = () => ARQ[S.arquetipo];
const somaAttr = () => Object.values(S.atributos).reduce((a,b)=>a+b,0);
const somaPer = () => Object.values(S.pericias).reduce((a,b)=>a+b,0);
const maxAttr = k => (arq() && arq().atributo===k) ? 5 : 4;
const maxPer = k => (arq() && arq().pericia===k) ? 3 : 2;
function infoItem(ref){
  if(!ref) return null; const [tipo,id] = ref.split(":");
  if(tipo==="arma") return {...D.ARMAS[id], cat:tipo};
  if(tipo==="armadura") return {...D.ARMADURAS[id], cat:tipo};
  if(tipo==="equip") return {...D.EQUIPAMENTOS[id], cat:tipo};
  if(tipo==="veiculo") return {...D.VEICULOS[id], cat:tipo, espacos:0};
  return null;
}
function espacosUsados(){
  let t=0; for(const e of S.equipamento){ const i=infoItem(e.ref); t += (i?.espacos ?? 1) * (e.qtd||1); } return t;
}
const espacosMax = () => S.atributos.vigor + 2 + (S.talento==="burroDeCarga"?1:0);
const fmtEsp = n => n===0?"—":(n%1? (n===0.5?"½":String(n).replace(".5","½")) : String(n));

const PASSOS = [
  { id:"arquetipo", nome:"Arquétipo", ok:()=>!!S.arquetipo },
  { id:"nome", nome:"Nome e cicatriz", ok:()=>S.nome.trim().length>0 },
  { id:"peculiaridade", nome:"Peculiaridade", ok:()=>S.peculiaridade.trim().length>0 },
  { id:"motivacao", nome:"Motivação", ok:()=>S.motivacao.trim().length>0 },
  { id:"atributos", nome:"Atributos", ok:()=>somaAttr()===13 },
  { id:"pericias", nome:"Perícias", ok:()=>somaPer()===12 },
  { id:"talento", nome:"Talento", ok:()=>!!S.talento },
  { id:"equipamento", nome:"Equipamento", ok:()=>S.equipamento.length>=3 && !!S.vasculhar },
  { id:"relacionamentos", nome:"Relacionamentos", ok:()=>S.relacionamentos.length>0 },
  { id:"ancoras", nome:"PNJs e Âncoras", ok:()=>!!S.ancoraPNJ && !!S.ancoraPJ },
  { id:"refugio", nome:"Refúgio", ok:()=>!!S.refugio.nome },
  { id:"revisao", nome:"Revisão e exportar", ok:()=>false }
];

function renderNav(){
  $("#nav").innerHTML = PASSOS.map((p,i)=>`<li><button data-ir="${i}" class="${i===S.passo?'on':''} ${p.ok()?'done':''}">${p.nome}</button></li>`).join("");
}

function rodape(){
  const ult = S.passo===PASSOS.length-1;
  const pronto = PASSOS[S.passo].ok();
  return `<div class="foot"><button class="btn" data-acao="voltar" ${S.passo===0?'disabled':''}>← Anterior</button>
  ${ult?'':`<button class="btn pri" data-acao="avancar">${pronto?'Próximo →':'Pular por enquanto →'}</button>`}</div>`;
}

function resumoItem(i){
  if(!i) return "item comum";
  if(i.cat==="arma") return i.pe?`Explosivo · PE ${i.pe} · bônus +${i.bonus}`:`Arma · dano ${i.dano} · bônus +${i.bonus} · ${i.alcance}`;
  if(i.cat==="armadura") return `Armadura ${i.valor} · penalidade −${i.penalidade}`;
  if(i.cat==="veiculo") return `Veículo · manobrabilidade +${i.manobrabilidade} · estrutura ${i.estrutura}`;
  return i.bonus?`${PER[i.bonus.pericia].nome} +${i.bonus.valor}`:"item útil";
}

    equipamento:S.equipamento.map(e=>({nome:e.nome, ref:e.ref||"", qtd:e.qtd||1})),
    vasculhar:S.vasculhar,
    relacionamentos:S.relacionamentos.map(r=>({pj:r.pj, texto:r.texto})),

  };
}
function baixar(){
  const blob = new Blob([JSON.stringify(exportar(),null,2)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = (S.nome||"sobrevivente").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w-]+/g,"_") + ".twd.json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// ---------- ações ----------
function adicionarEquipArq(i){
  const [nome, ref] = arq().eq[i];
  if(S.equipamento.some(e=>e.origem==="arq"&&e.idx===i)) return false;
  const partes = ref.split(":"); let qtd = 1;
  if(partes[2]==="d6") qtd = d6(); else if(partes[2]) qtd = +partes[2];
  const limpo = nome.replace(/^D6 /,"").replace(/^Duas /,""); S.equipamento.push({nome: limpo.charAt(0).toUpperCase()+limpo.slice(1), ref: partes.slice(0,2).join(":"), qtd, origem:"arq", idx:i});
  return true;
}
document.addEventListener("click", ev=>{
  const b = ev.target.closest("button"); if(!b) return;
  const ds = b.dataset;
  if(ds.ir!==undefined){ S.passo=+ds.ir; render(); window.scrollTo({top:0}); return; }
  if(ds.arq){ if(S.arquetipo!==ds.arq){ S.arquetipo=ds.arq; S.talento=""; S.equipamento=S.equipamento.filter(e=>e.origem!=="arq"); S.rolagensEquip=[];
      for(const k in S.atributos) S.atributos[k]=Math.min(S.atributos[k],maxAttr(k)); for(const k in S.pericias) S.pericias[k]=Math.min(S.pericias[k],maxPer(k)); }
    render(); return; }
  if(ds.cic!==undefined){ const c=D.CICATRIZES[+ds.cic]; S.cicatriz = S.cicatriz===c ? "" : c; render(); return; }
  if(ds.set){ S[ds.set]=ds.val; render(); return; }
  if(ds.attr){ const k=ds.attr, d=+ds.d, v=S.atributos[k]+d; if(v<2||v>maxAttr(k)||(d>0&&somaAttr()>=13)) return; S.atributos[k]=v; render(); return; }
  if(ds.per){ const k=ds.per, d=+ds.d, v=S.pericias[k]+d; if(v<0||v>maxPer(k)||(d>0&&somaPer()>=12)) return; S.pericias[k]=v; render(); return; }
  if(ds.tal){ S.talento=ds.tal; render(); return; }
  if(ds.eq!==undefined){ const i=+ds.eq; const j=S.equipamento.findIndex(e=>e.origem==="arq"&&e.idx===i); if(j>=0) S.equipamento.splice(j,1); else adicionarEquipArq(i); render(); return; }
  if(ds.rmeq!==undefined){ S.equipamento.splice(+ds.rmeq,1); render(); return; }
  if(ds.rmrel!==undefined){ S.relacionamentos.splice(+ds.rmrel,1); render(); return; }
  if(ds.relsug){ $("#iRelTx").value=ds.relsug; $("#iRelPJ").focus(); return; }
  if(ds.ancpnj){ S.ancoraPNJ=ds.ancpnj; render(); return; }
  if(ds.ref){ const r=D.REFUGIOS[ds.ref]; S.refugio = r? {id:ds.ref, nome:r.nome, capacidade:r.capacidade, defesa:r.defesa, desc:r.desc, peculiaridades:[...r.peculiaridades]} : {id:"custom", nome:"Nosso refúgio", capacidade:2, defesa:1, desc:"", peculiaridades:[]}; render(); return; }
  switch(ds.acao){
    case "voltar": S.passo=Math.max(0,S.passo-1); render(); window.scrollTo({top:0}); break;
    case "avancar": S.passo=Math.min(PASSOS.length-1,S.passo+1); render(); window.scrollTo({top:0}); break;
    case "semCicatriz": S.cicatriz=""; render(); break;
    case "cicatriz": { const n=d6(); S.cicatriz=D.CICATRIZES[n-1]; toast(`Rolou ${n}`); render(); break; }
    case "rolarEq": {
      S.equipamento=S.equipamento.filter(e=>e.origem!=="arq"); S.rolagensEquip=[]; const vistos=new Set(); let guard=0;
      while(vistos.size<3 && guard++<50){ const n=d6(); S.rolagensEquip.push(n); if(!vistos.has(n)){ vistos.add(n); adicionarEquipArq(n-1);} }
      render(); document.querySelectorAll("#dadosEq .die").forEach(d=>d.classList.add("roll")); break; }
    case "limparEq": S.equipamento=S.equipamento.filter(e=>e.origem!=="arq"); S.rolagensEquip=[]; render(); break;
    case "vasculhar": { const c=`${d6()}${d6()}${d6()}`; S.vasculhar={codigo:c, texto:D.VASCULHAR[c]}; toast(`D666 = ${c}`); render(); break; }
    case "itemLivre": { const v=$("#iItemLivre").value.trim(); if(!v) return; S.equipamento.push({nome:v, ref:"", qtd:1, origem:"livre"}); render(); break; }
    case "addRel": { const pj=$("#iRelPJ").value.trim(), tx=$("#iRelTx").value.trim(); if(!pj||!tx){ toast("Preencha o nome e o relacionamento"); return; } S.relacionamentos.push({pj,texto:tx}); render(); break; }
    case "rolarGrupo": { S.grupoPNJ=d6(); toast(`Grupo ${S.grupoPNJ}`); render(); break; }
    case "pecRef": { const c=`${d6()}${d6()}`; const p=D.PECULIARIDADES_REFUGIO[c]; S.refugio.peculiaridades.push(p); toast(`${c}: ${p}`); render(); break; }
    case "baixar": baixar(); toast("Arquivo baixado"); break;
    case "copiar": navigator.clipboard?.writeText(JSON.stringify(exportar(),null,2)).then(()=>toast("JSON copiado"),()=>toast("Não foi possível copiar")); break;
    case "imprimir": window.print(); break;
  }
});
document.addEventListener("input", ev=>{
  const el=ev.target;
  if(el.dataset.campo){ S[el.dataset.campo]=el.value; renderFicha(); renderNav(); salvar(); }
  if(el.dataset.relpnj){ S.relacoesPNJ[el.dataset.relpnj]=el.value; salvar(); }
  if(el.dataset.refCampo){ const k=el.dataset.refCampo; S.refugio[k] = k==="peculiaridades"? el.value.split("\n").map(s=>s.trim()).filter(Boolean) : (k==="capacidade"||k==="defesa"? +el.value : el.value); renderFicha(); salvar(); }
});
document.addEventListener("change", ev=>{ if(ev.target.id==="sGrupo"){ S.grupoPNJ=+ev.target.value; render(); } });
document.addEventListener("keydown", ev=>{ if(ev.key==="Enter" && (ev.target.id==="iRelTx"||ev.target.id==="iRelPJ")) document.querySelector('[data-acao="addRel"]').click(); if(ev.key==="Enter"&&ev.target.id==="iItemLivre") document.querySelector('[data-acao="itemLivre"]').click(); });

$("#bNovo").onclick = ()=>{ if(confirm("Começar uma ficha nova? A atual será apagada deste navegador.")){ S=estadoVazio(); render(); } };
$("#bImportar").onclick = ()=>$("#fArquivo").click();
$("#fArquivo").onchange = async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  try{ const j=JSON.parse(await f.text()); if(j.formato!=="twdu-ficha") throw 0;
    const n=estadoVazio(); Object.assign(n,{nome:j.nome||"", jogador:j.jogador||"", arquetipo:j.arquetipo||"", peculiaridade:j.peculiaridade||"", motivacao:j.motivacao||"", cicatriz:j.cicatriz||"", aparencia:j.aparencia||"", historia:j.historia||""});
    Object.assign(n.atributos,j.atributos||{}); Object.assign(n.pericias,j.pericias||{});
    n.talento=j.talentos?.[0]?.id||""; n.talentoHistoria=j.talentos?.[0]?.historia||"";
    n.equipamento=(j.equipamento||[]).map(e=>({...e, origem:"livre"})); n.vasculhar=j.vasculhar||null;
    n.relacionamentos=j.relacionamentos||[]; n.ancoraPJ=j.ancoras?.pj||""; n.ancoraPNJ=j.ancoras?.pnj||"";
    const g=Object.entries(D.PNJS_SOBREVIVENTES).find(([,l])=>l.some(p=>j.pnjs?.some(q=>q.nome===p.nome))); n.grupoPNJ=g?+g[0]:0;
    (j.pnjs||[]).forEach(p=>n.relacoesPNJ[p.nome]=p.relacao||"");
    if(j.refugio) n.refugio={id:"custom", ...j.refugio, peculiaridades:j.refugio.peculiaridades||[]};
    n.passo=PASSOS.length-1; S=n; render(); toast("Ficha carregada");
  }catch(e){ toast("Arquivo inválido"); }
  ev.target.value="";
};
$("#bTema").onclick = ()=>{ const r=document.documentElement; const atual=r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); r.dataset.theme = atual==="dark"?"light":"dark"; try{localStorage.setItem(CHAVE+"-tema",r.dataset.theme)}catch(e){} };
try{ const t=localStorage.getItem(CHAVE+"-tema"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
render();
</script>
